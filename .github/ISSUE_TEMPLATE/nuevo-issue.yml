name: Nuevo issue
description: Proponer una tarea o mejora del proyecto
title: "[DVXXX] "
labels: []
body:
  - type: input
    id: related
    attributes:
      label: Relacionado con
      description: "Indica el issue relacionado, por ejemplo #3."
      placeholder: "#3"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explica por qué es necesaria esta tarea.
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Qué hay que hacer
      description: Describe el trabajo concreto.
    validations:
      required: true

  - type: textarea
    id: closure
    attributes:
      label: Criterio de cierre
      description: Añade una lista de comprobaciones que permitan cerrar el issue.
      placeholder: |
        - [ ] Primera condición
        - [ ] Segunda condición
    validations:
      required: true
