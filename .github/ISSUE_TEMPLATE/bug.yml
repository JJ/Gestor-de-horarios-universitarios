name: Reportar un bug
description: Informar de un comportamiento incorrecto
title: "[BXXX] "
labels:
  - bug
body:
  - type: input
    id: related
    attributes:
      label: Relacionado con
      description: Issue o funcionalidad afectada.
      placeholder: "#3"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Describe dónde y cuándo aparece el problema.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Indica los pasos necesarios para reproducir el error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento observado
    validations:
      required: true

  - type: textarea
    id: closure
    attributes:
      label: Criterio de cierre
      description: Condiciones que deben cumplirse para cerrar el bug.
      placeholder: |
        - [ ] El error está corregido
        - [ ] Se ha comprobado que no se reproduce
    validations:
      required: true
